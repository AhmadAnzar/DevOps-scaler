name: GitTogether CI/CD

# Pipeline: lint + test + build  ->  Docker build  ->  Trivy scan  ->  push to GHCR
# Images are tagged with the full commit SHA (never `latest`), so every image traces back to one commit.

on:
  push:
    branches: [capstone, main]
    paths:
      - "gittogether/**"
      - ".github/workflows/gittogether-ci.yml"
  pull_request:
    branches: [capstone, main]
    paths:
      - "gittogether/**"
      - ".github/workflows/gittogether-ci.yml"
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # STAGE 1a: backend quality gate
  # ========================================
  backend:
    name: Backend - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gittogether/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gittogether/backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Test (pytest, fails below 90% coverage)
        run: pytest -v

  # ========================================
  # STAGE 1b: frontend build (runs in parallel with the backend job)
  # ========================================
  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gittogether/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gittogether/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  # ========================================
  # STAGE 2: build -> scan -> push, once per image
  # ========================================
  images:
    name: Image - ${{ matrix.component }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry with the built-in GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        # Registry paths must be lowercase; the GitHub owner name may not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gittogether-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: gittogether/${{ matrix.component }}
          load: true # keep the image locally so Trivy can scan it before anything is pushed
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=gittogether-${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scan image (Trivy, fails on HIGH/CRITICAL)
        # Pinned to a commit SHA, not a tag: tags can be moved or deleted (this action's were in 2026).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Summary
        if: github.event_name != 'pull_request'
        run: echo "Pushed \`$IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
