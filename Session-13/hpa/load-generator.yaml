apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          # keeps hitting the hpa-demo service from 04-hpa
          command:
            - /bin/sh
            - -c
            - while true; do wget -q -O- http://hpa-demo-service > /dev/null; done
