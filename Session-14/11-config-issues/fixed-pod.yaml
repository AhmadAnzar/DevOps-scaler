apiVersion: v1
kind: Pod

metadata:
  name: config-demo

spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo "Connecting to $DB_HOST" && sleep 3600
      env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_HOST
