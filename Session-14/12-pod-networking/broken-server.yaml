apiVersion: v1
kind: Pod

metadata:
  name: net-server
  labels:
    app: net-server

spec:
  containers:
    - name: web
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          mkdir -p /www
          echo "hello from net-server" > /www/index.html
          httpd -f -p 127.0.0.1:8080 -h /www
