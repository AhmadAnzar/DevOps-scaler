services:
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    networks:
      - frontend_net

  backend:
    image: alpine:3.22
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    networks:
      - frontend_net
      - backend_net

  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - backend_net
      - database_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database_data:

networks:
  frontend_net:
    name: course-frontend-net
  backend_net:
    name: course-backend-net
  database_net:
    name: course-database-net
