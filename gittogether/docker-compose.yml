services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gittogether
      POSTGRES_USER: gittogether
      POSTGRES_PASSWORD: gittogether
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gittogether -d gittogether"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gittogether:gittogether@postgres:5432/gittogether
    depends_on:
      postgres:
        condition: service_healthy  # wait for Postgres before running Alembic migrations
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:8080"  # nginx-unprivileged listens on 8080 inside the container

volumes:
  postgres-data:
