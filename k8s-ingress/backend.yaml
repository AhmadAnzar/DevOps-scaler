apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine
          command:
            - sh
            - -c
            - |
              python3 -c "
              import os
              from http.server import HTTPServer, BaseHTTPRequestHandler

              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, format, *args):
                      pass
                  def do_GET(self):
                      body = (
                          'Backend response\n'
                          'ENVIRONMENT: ' + os.getenv('ENVIRONMENT', 'unknown') + '\n'
                          'LOG_LEVEL: ' + os.getenv('LOG_LEVEL', 'unknown') + '\n'
                          'POSTGRES_USER: ' + os.getenv('POSTGRES_USER', 'unknown') + '\n'
                      ).encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/plain')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              HTTPServer(('0.0.0.0', 5000), Handler).serve_forever()
              "
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 5000