apiVersion: apps/v1
kind: Deployment
metadata:
  name: session17-python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session17-python
  template:
    metadata:
      labels:
        app: session17-python
    spec:
      # created by the pipeline so the cluster can pull from ghcr.io
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: session17-python
          # the pipeline replaces __IMAGE_TAG__ with the commit sha
          image: ghcr.io/ahmadanzar/session17-devsecops:__IMAGE_TAG__
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
