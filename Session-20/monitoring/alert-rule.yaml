apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-health-alerts
  namespace: monitoring
  labels:
    # kube-prometheus-stack only loads rules with its release label
    release: monitoring
spec:
  groups:
    - name: pod-health
      rules:
        - alert: PodStuckWaiting
          expr: sum by (namespace, pod, reason) (kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull"}) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is stuck in {{ $labels.reason }}"
        - alert: HighPodCPU
          expr: sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=""}[2m])) > 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is using more than half a CPU core"
